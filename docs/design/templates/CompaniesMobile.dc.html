<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--brand-navy:#324168;--brand-sky:#64b3dd;--brand-sky-soft:#e3f1fa;--canvas:#eef3f8;--surface:#ffffff;--surface-muted:#f5f8fc;--border:#dbe4ee;--border-strong:#6f819c;--ink:#17203a;--ink-muted:#4f5b77;--primary:#324168;--primary-hover:#28345a;--on-primary:#ffffff;--accent:#64b3dd;--on-accent:#17203a;--accent-soft:#e3f1fa;--accent-soft-ink:#1b5c85;--ring:#324168;--danger:#b3261e;--on-danger:#ffffff;--hero:#324168;--on-hero:#ffffff;--chart-1:#324168;--chart-2:#2f88ba;--status-confirmed:#0f6b3a;--status-confirmed-bg:#e3f5ea;--status-needs-review:#8a4b00;--status-needs-review-bg:#fdf0d8;--status-error:#a3202a;--status-error-bg:#fce6e7;--status-processing:#4d3fa3;--status-processing-bg:#ece9fb;--status-pending:#46526c;--status-pending-bg:#e8edf4;--status-canceled:#5b6478;--status-canceled-bg:#eef0f4;--shadow-card:0 1px 2px rgba(23, 32, 58, 0.05), 0 4px 16px rgba(23, 32, 58, 0.04);--shadow-popover:0 8px 32px rgba(23, 32, 58, 0.14);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-12:48px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;--font-sans:"Plus Jakarta Sans", system-ui, sans-serif;--font-mono:"JetBrains Mono", ui-monospace, monospace;--text-display-lg:700 32px/40px var(--font-sans);--text-display-md:700 24px/32px var(--font-sans);--text-heading-lg:700 20px/28px var(--font-sans);--text-heading-md:600 16px/24px var(--font-sans);--text-body:400 14px/20px var(--font-sans);--text-body-strong:600 14px/20px var(--font-sans);--text-caption:500 12px/16px var(--font-sans);--text-overline:600 11px/16px var(--font-sans);--text-figure-lg:700 28px/36px var(--font-sans);--text-figure-md:600 16px/24px var(--font-sans);--text-code:400 13px/20px var(--font-mono);}}</style>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Empresas móvil</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--brand-navy:#324168;--brand-sky:#64B3DD;--canvas:#EEF3F8;--surface:#FFFFFF;--surface-muted:#F5F8FC;--border:#DBE4EE;--border-strong:#6F819C;--ink:#17203A;--ink-muted:#4F5B77;--primary:#324168;--primary-hover:#28345A;--on-primary:#FFFFFF;--accent-soft:#E3F1FA;--accent-soft-ink:#1B5C85;--ring:#324168;--hero:#324168;--on-hero:#FFFFFF;--hero-ink-muted:#C7D0E4;--hero-hover:rgba(255,255,255,.10);--overlay:rgba(23,32,58,.40);--status-confirmed:#0F6B3A;--status-confirmed-bg:#E3F5EA;--status-needs-review:#8A4B00;--status-needs-review-bg:#FDF0D8;--status-error:#A3202A;--status-error-bg:#FCE6E7;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;--shadow-card:0 1px 2px rgba(23,32,58,.05),0 4px 16px rgba(23,32,58,.04);--shadow-popover:0 8px 32px rgba(23,32,58,.14);--font-sans:"Plus Jakarta Sans",system-ui,sans-serif}
.root{box-sizing:border-box;position:relative;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:20px}
.root *,.root *::before,.root *::after{box-sizing:border-box}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{flex:none;display:flex;align-items:center;gap:4px;padding:8px 12px 8px 20px;background:var(--hero);color:var(--on-hero)}
.brand{margin-right:auto;font:700 22px/28px var(--font-sans);letter-spacing:-.01em}
.tbtn{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:var(--radius-pill);background:transparent;color:var(--on-hero);cursor:pointer}
.tbtn:hover{background:var(--hero-hover)}
.tbtn:focus-visible{outline:2px solid var(--brand-sky);outline-offset:2px}
.tbtn .ic{width:20px;height:20px}
.avatar{display:grid;place-items:center;flex:none;width:36px;height:36px;margin-left:4px;border-radius:var(--radius-pill);background:var(--brand-sky);color:var(--ink);font:700 13px/16px var(--font-sans)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 152px;display:flex;flex-direction:column;gap:16px}
.search{flex:none;display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-pill);color:var(--ink-muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:400 14px/20px var(--font-sans)}
.search input::placeholder{color:var(--ink-muted)}
.search:focus-within{outline:2px solid var(--ring);outline-offset:2px}
.alert{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:var(--radius-md);background:var(--status-confirmed-bg);color:var(--status-confirmed);font:500 14px/20px var(--font-sans)}
.alert .ic{width:20px;height:20px}
.alert .x{margin-left:auto;display:grid;place-items:center;width:32px;height:32px;margin-top:-6px;margin-right:-10px;border:0;border-radius:var(--radius-pill);background:transparent;color:inherit;cursor:pointer}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rec{position:relative;display:flex;align-items:center;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
.rec:hover{background:var(--surface-muted)}
.rec.new{background:var(--accent-soft)}
.mark{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:var(--radius-md);background:var(--accent-soft);color:var(--accent-soft-ink)}
.rec.new .mark{background:var(--surface)}
.mark .ic{width:20px;height:20px}
.rl{color:var(--ink);text-decoration:none;font:600 15px/24px var(--font-sans)}
.rl::after{content:"";position:absolute;inset:0;border-radius:var(--radius-lg)}
.rl:focus-visible{outline:none}
.rl:focus-visible::after{outline:2px solid var(--ring);outline-offset:2px}
.mt{font:500 12px/16px var(--font-sans);color:var(--ink-muted);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;flex:none;height:24px;padding:0 10px;border-radius:var(--radius-pill);background:var(--status-confirmed-bg);color:var(--status-confirmed);font:600 12px/16px var(--font-sans);white-space:nowrap}
.chev{flex:none;color:var(--ink-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border:1px solid transparent;border-radius:var(--radius-pill);background:var(--primary);color:var(--on-primary);font:600 14px/20px var(--font-sans);cursor:pointer}
.btn.soft{background:var(--accent-soft);color:var(--accent-soft-ink)}
.btn.ghost{background:transparent;border-color:var(--border-strong);color:var(--ink)}
.btn:focus-visible,.x:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 16px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
.fab{position:absolute;right:16px;bottom:84px;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px;border:0;border-radius:var(--radius-pill);background:var(--primary);color:var(--on-primary);font:600 14px/20px var(--font-sans);box-shadow:var(--shadow-popover);cursor:pointer}
.fab:hover{background:var(--primary-hover)}
.fab:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.bar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;background:var(--surface);border-top:1px solid var(--border)}
.bt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;border:0;border-radius:var(--radius-md);background:transparent;color:var(--ink-muted);font:600 11px/16px var(--font-sans);cursor:pointer}
.bt:focus-visible{outline:2px solid var(--ring);outline-offset:-2px}
.bt .pic{display:grid;place-items:center;width:56px;height:28px;border-radius:var(--radius-pill)}
.bt .ic{width:20px;height:20px}
.bt[aria-current="page"]{color:var(--ink)}
.bt[aria-current="page"] .pic{background:var(--accent-soft);color:var(--accent-soft-ink)}
.bt .cnt{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;border-radius:var(--radius-pill);background:var(--status-needs-review-bg);color:var(--status-needs-review);font:700 11px/14px var(--font-sans)}
.ov{position:absolute;inset:0;z-index:10;background:var(--overlay)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;display:flex;flex-direction:column;gap:20px;padding:12px 20px 24px;background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-popover)}
.grab{align-self:center;width:40px;height:4px;border-radius:var(--radius-pill);background:var(--border)}
.fl{font:600 12px/16px var(--font-sans);color:var(--ink-muted)}
.inp{width:100%;height:48px;padding:0 16px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font:400 16px/24px var(--font-sans)}
.inp:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.inp.bad{border-color:var(--status-error);box-shadow:0 0 0 1px var(--status-error)}
.help{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}
.err{display:flex;align-items:center;gap:6px;font:600 12px/16px var(--font-sans);color:var(--status-error)}
</style>
</helmet>
<div class="root">
  <header class="top">
    <span class="brand">Tpvs</span>
    <button type="button" class="tbtn" aria-label="Notificaciones">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
    </button>
    <span class="avatar" role="img" aria-label="{{ userName }}, {{ roleLabel }}">{{ initials }}</span>
  </header>

  <main class="scroll">
    <h1 style="margin: 0; font: 700 24px/32px var(--font-sans); letter-spacing: -0.01em">Empresas</h1>

    <label class="search">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input type="search" placeholder="Buscar empresa…" aria-label="Buscar empresas" value="{{ q }}" onChange="{{ onQ }}">
    </label>

    <sc-if value="{{ showOk }}" hint-placeholder-val="{{ false }}">
      <div class="alert" role="status">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.801 10A10 10 0 1 1 17 3.335"></path><path d="m9 11 3 3L22 4"></path></svg>
        <span>{{ okText }}</span>
        <button type="button" class="x" aria-label="Cerrar aviso" onClick="{{ closeOk }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
    </sc-if>

    <span class="mt" style="font-size: 13px; margin: -4px 0"><strong style="color: var(--ink); font-variant-numeric: tabular-nums">{{ count }}</strong> {{ countWord }}</span>

    <ul class="list" aria-label="Lista de empresas">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <li class="{{ r.cls }}">
          <span class="mark" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4"></path></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <a class="rl" href="#" aria-label="{{ r.aria }}">{{ r.name }}</a>
            <span class="mt">{{ r.meta }}</span>
          </span>
          <sc-if value="{{ r.isNew }}" hint-placeholder-val="{{ false }}"><span class="pill">Nueva</span></sc-if>
          <span class="chev"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="m9 18 6-6-6-6"></path></svg></span>
        </li>
      </sc-for>
    </ul>

    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div class="empty">
        <h2 style="margin: 0; font: 600 16px/24px var(--font-sans)">No encontramos empresas con ese nombre</h2>
        <p style="margin: 0; color: var(--ink-muted)">Revisa la ortografía o prueba con otra palabra.</p>
        <button type="button" class="btn soft" style="margin-top: 8px" onClick="{{ clearQ }}">Limpiar búsqueda</button>
      </div>
    </sc-if>
  </main>

  <sc-if value="{{ isEditor }}" hint-placeholder-val="{{ true }}">
    <button type="button" class="fab" onClick="{{ openDlg }}">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M5 12h14M12 5v14"></path></svg>
      Nueva empresa
    </button>
  </sc-if>

  <nav class="bar" aria-label="Principal">
    <button type="button" class="bt" aria-current="false">
      <span class="pic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg></span>
      Dashboard
    </button>
    <button type="button" class="bt" aria-current="false">
      <span class="pic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8"></path></svg></span>
      Registros
      <sc-if value="{{ isEditor }}" hint-placeholder-val="{{ true }}">
        <span class="cnt" aria-label="4 registros por revisar">4</span>
      </sc-if>
    </button>
    <button type="button" class="bt" aria-current="page">
      <span class="pic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4"></path></svg></span>
      Empresas
    </button>
    <button type="button" class="bt" aria-current="false">
      <span class="pic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16M18 17V9M13 17V5M8 17v-3"></path></svg></span>
      Reportes
    </button>
  </nav>

  <sc-if value="{{ dlgOpen }}" hint-placeholder-val="{{ false }}">
    <div class="ov" onClick="{{ closeDlg }}"></div>
    <form class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlg-t" onSubmit="{{ submit }}">
      <span class="grab" aria-hidden="true"></span>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h2 id="dlg-t" style="margin: 0; font: 700 20px/28px var(--font-sans); letter-spacing: -0.01em">Nueva empresa</h2>
        <p style="margin: 0; color: var(--ink-muted)">Agrégala al catálogo para poder asignarle registros.</p>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span class="fl">Nombre</span>
        <input class="inp {{ inpCls }}" type="text" placeholder="Ej. Company Centro" autocomplete="off" value="{{ name }}" onInput="{{ onName }}" aria-invalid="{{ hasErr }}">
        <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}">
          <span class="err" role="alert"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>{{ err }}</span>
        </sc-if>
        <sc-if value="{{ noErr }}" hint-placeholder-val="{{ true }}">
          <span class="help">Después de crearla no podrás cambiar el nombre.</span>
        </sc-if>
      </label>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <button type="submit" class="btn">Crear empresa</button>
        <button type="button" class="btn ghost" onClick="{{ closeDlg }}">Cancelar</button>
      </div>
    </form>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rol":{"editor":"enum","options":["editor","viewer"],"default":"editor","section":"Usuario"},"nombre":{"editor":"text","default":"María López","section":"Usuario"},"dialogo":{"editor":"enum","options":["cerrado","abierto","error"],"default":"cerrado","section":"Vista"},"$preview":{"width":390,"height":844}}'>
// nombre, registros, creada
const DATA = [
  ['Company ABC', 24, '2026-01-12'],
  ['Company Delta', 12, '2026-03-04'],
  ['Company North', 7, '2026-02-20'],
  ['Company Oriente', 5, '2026-06-18'],
  ['Company Sur', 0, '2026-10-30'],
  ['Company XYZ', 18, '2026-01-12']
];
const fmtDate = (iso) => iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(2, 4);
const TODAY = '2026-11-18';
const norm = (s) => s.trim().replace(/\s+/g, ' ').toLowerCase();

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const d = props.dialogo || 'cerrado';
    this.state = {
      q: '',
      open: d !== 'cerrado',
      name: d === 'error' ? 'Company ABC' : '',
      err: d === 'error' ? 'Ya existe una empresa con ese nombre.' : '',
      added: [],
      ok: ''
    };
  }
  renderVals() {
    const s = this.state;
    const isEditor = (this.props.rol || 'editor') === 'editor';
    const q = norm(s.q);
    const all = DATA.map((d) => ({ name: d[0], records: d[1], created: d[2], isNew: false })).concat(s.added);
    all.sort((a, b) => a.name.localeCompare(b.name, 'es'));
    const list = all.filter((c) => !q || c.name.toLowerCase().indexOf(q) !== -1);
    const rows = list.map((c) => ({
      name: c.name,
      aria: 'Ver registros de ' + c.name,
      meta: c.records + (c.records === 1 ? ' registro' : ' registros') + ' · creada ' + fmtDate(c.created),
      isNew: c.isNew,
      cls: c.isNew ? 'rec new' : 'rec'
    }));
    const name = this.props.nombre ?? 'María López';
    const initials = name.split(' ').filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
    const submit = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      const n = s.name.trim().replace(/\s+/g, ' ');
      if (!n) return this.setState({ err: 'Escribe el nombre de la empresa.' });
      if (all.some((c) => norm(c.name) === norm(n))) return this.setState({ err: 'Ya existe una empresa con ese nombre.' });
      const added = s.added.map((c) => Object.assign({}, c, { isNew: false })).concat([{ name: n, records: 0, created: TODAY, isNew: true }]);
      this.setState({ added: added, open: false, name: '', err: '', q: '', ok: 'Creaste la empresa ' + n + '.' });
    };
    return {
      isEditor: isEditor,
      userName: name,
      initials: initials,
      roleLabel: isEditor ? 'Editor' : 'Viewer',
      q: s.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      clearQ: () => this.setState({ q: '' }),
      rows: rows,
      isEmpty: rows.length === 0,
      count: rows.length,
      countWord: rows.length === 1 ? 'empresa' : 'empresas',
      showOk: s.ok !== '',
      okText: s.ok,
      closeOk: () => this.setState({ ok: '' }),
      dlgOpen: isEditor && s.open,
      openDlg: () => this.setState({ open: true, name: '', err: '' }),
      closeDlg: () => this.setState({ open: false, name: '', err: '' }),
      name: s.name,
      onName: (e) => this.setState({ name: e.target.value, err: '' }),
      hasErr: s.err !== '',
      noErr: s.err === '',
      err: s.err,
      inpCls: s.err !== '' ? 'bad' : '',
      submit: submit
    };
  }
}
</script>
</body>
</html>
