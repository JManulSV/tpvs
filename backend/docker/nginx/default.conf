# tpvs-web: the only entry point in production.
#   :80   public  -> Next.js (tpvs-frontend:3000)
#   :8080 internal -> Laravel php-fpm (tpvs-backend:9000), used only by the
#         Next.js BFF (LARAVEL_API_URL=http://tpvs-web:8080). Not published.
# HTTPS will be added here when the LAN deployment (roadmap 8.18) arrives.

server {
    listen 80;
    server_name _;

    # Image uploads go through the BFF: up to 10 MiB plus form overhead.
    client_max_body_size 12m;

    location / {
        proxy_pass http://tpvs-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 12m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass tpvs-backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # AI requests are queued, so no request should take long.
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
