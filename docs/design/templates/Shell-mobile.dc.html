<!doctype html>
<meta charset="utf-8"><style data-dc-design-system-vars>@layer{:root{--brand-navy:#324168;--brand-sky:#64b3dd;--brand-sky-soft:#e3f1fa;--canvas:#eef3f8;--surface:#ffffff;--surface-muted:#f5f8fc;--border:#dbe4ee;--border-strong:#6f819c;--ink:#17203a;--ink-muted:#4f5b77;--primary:#324168;--primary-hover:#28345a;--on-primary:#ffffff;--accent:#64b3dd;--on-accent:#17203a;--accent-soft:#e3f1fa;--accent-soft-ink:#1b5c85;--ring:#324168;--danger:#b3261e;--on-danger:#ffffff;--hero:#324168;--on-hero:#ffffff;--chart-1:#324168;--chart-2:#2f88ba;--status-confirmed:#0f6b3a;--status-confirmed-bg:#e3f5ea;--status-needs-review:#8a4b00;--status-needs-review-bg:#fdf0d8;--status-error:#a3202a;--status-error-bg:#fce6e7;--status-processing:#4d3fa3;--status-processing-bg:#ece9fb;--status-pending:#46526c;--status-pending-bg:#e8edf4;--status-canceled:#5b6478;--status-canceled-bg:#eef0f4;--shadow-card:0 1px 2px rgba(23, 32, 58, 0.05), 0 4px 16px rgba(23, 32, 58, 0.04);--shadow-popover:0 8px 32px rgba(23, 32, 58, 0.14);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-12:48px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;--font-sans:"Plus Jakarta Sans", system-ui, sans-serif;--font-mono:"JetBrains Mono", ui-monospace, monospace;--text-display-lg:700 32px/40px var(--font-sans);--text-display-md:700 24px/32px var(--font-sans);--text-heading-lg:700 20px/28px var(--font-sans);--text-heading-md:600 16px/24px var(--font-sans);--text-body:400 14px/20px var(--font-sans);--text-body-strong:600 14px/20px var(--font-sans);--text-caption:500 12px/16px var(--font-sans);--text-overline:600 11px/16px var(--font-sans);--text-figure-lg:700 28px/36px var(--font-sans);--text-figure-md:600 16px/24px var(--font-sans);--text-code:400 13px/20px var(--font-mono);}}</style>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sidebar y topbar móvil</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--brand-navy:#324168;--brand-sky:#64B3DD;--canvas:#EEF3F8;--surface:#FFFFFF;--surface-muted:#F5F8FC;--border:#DBE4EE;--border-strong:#6F819C;--ink:#17203A;--ink-muted:#4F5B77;--primary:#324168;--primary-hover:#28345A;--on-primary:#FFFFFF;--accent-soft:#E3F1FA;--accent-soft-ink:#1B5C85;--ring:#324168;--hero:#324168;--on-hero:#FFFFFF;--hero-ink-muted:#C7D0E4;--hero-hover:rgba(255,255,255,.10);--status-error:#A3202A;--status-needs-review:#8A4B00;--status-needs-review-bg:#FDF0D8;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;--shadow-card:0 1px 2px rgba(23,32,58,.05),0 4px 16px rgba(23,32,58,.04);--shadow-popover:0 8px 32px rgba(23,32,58,.14);--font-sans:"Plus Jakarta Sans",system-ui,sans-serif}
.root{box-sizing:border-box;position:relative;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:20px}
.root *,.root *::before,.root *::after{box-sizing:border-box}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{flex:none;display:flex;align-items:center;gap:4px;padding:8px 12px 8px 20px;background:var(--hero);color:var(--on-hero)}
.brand{margin-right:auto;font:700 22px/28px var(--font-sans);letter-spacing:-.01em}
.tbtn{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:var(--radius-pill);background:transparent;color:var(--on-hero);cursor:pointer;transition:background-color .15s ease}
.tbtn:hover{background:var(--hero-hover)}
.tbtn:focus-visible{outline:2px solid var(--brand-sky);outline-offset:2px}
.tbtn .ic{width:20px;height:20px}
.avatar{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:var(--radius-pill);background:var(--brand-sky);color:var(--ink);font:700 13px/16px var(--font-sans)}
.avbtn{width:44px;height:44px;margin-left:4px}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
.sk{background:var(--surface-muted);border-radius:var(--radius-pill)}
.fab{position:absolute;right:16px;bottom:84px;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px;border:0;border-radius:var(--radius-pill);background:var(--primary);color:var(--on-primary);font:600 14px/20px var(--font-sans);box-shadow:var(--shadow-popover);cursor:pointer}
.fab:hover{background:var(--primary-hover)}
.fab:focus-visible,.out:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.bar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;background:var(--surface);border-top:1px solid var(--border)}
.bt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;border:0;border-radius:var(--radius-md);background:transparent;color:var(--ink-muted);font:600 11px/16px var(--font-sans);cursor:pointer}
.bt:focus-visible{outline:2px solid var(--ring);outline-offset:-2px}
.bt .pic{display:grid;place-items:center;width:56px;height:28px;border-radius:var(--radius-pill);transition:background-color .15s ease}
.bt .ic{width:20px;height:20px}
.bt[aria-current="page"]{color:var(--ink)}
.bt[aria-current="page"] .pic{background:var(--accent-soft);color:var(--accent-soft-ink)}
.bt .cnt{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;border-radius:var(--radius-pill);background:var(--status-needs-review-bg);color:var(--status-needs-review);font:700 11px/14px var(--font-sans)}
.scrim{position:absolute;inset:0;border:0;padding:0;background:rgba(23,32,58,.5);cursor:pointer}
.sheet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;padding:12px 16px 24px;background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-popover)}
.grab{align-self:center;width:36px;height:4px;margin-bottom:8px;border-radius:var(--radius-pill);background:var(--border)}
.out{display:flex;align-items:center;gap:12px;height:48px;padding:0 12px;border:0;border-radius:var(--radius-md);background:transparent;color:var(--status-error);font:600 14px/20px var(--font-sans);cursor:pointer}
.out:hover{background:var(--surface-muted)}
.out .ic{width:20px;height:20px}
</style>
</helmet>
<div class="root">
  <header class="top">
    <span class="brand">Tpvs</span>
    <button type="button" class="tbtn" aria-label="Buscar">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
    </button>
    <button type="button" class="tbtn" aria-label="Notificaciones">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
    </button>
    <button type="button" class="tbtn avbtn" aria-label="Cuenta de {{ userName }}" aria-expanded="{{ sheetExpanded }}" onClick="{{ openSheet }}">
      <span class="avatar" aria-hidden="true">{{ initials }}</span>
    </button>
  </header>

  <main class="scroll">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font: 700 24px/32px var(--font-sans); letter-spacing: -0.01em">{{ pageTitle }}</h1>
      <span style="font: 500 12px/16px var(--font-sans); color: var(--ink-muted)">Semana 38 · 28 ago – 15 sep</span>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
      <div class="card" style="display: flex; flex-direction: column; gap: 12px; padding: 16px"><div class="sk" style="width: 40px; height: 40px; border-radius: var(--radius-md)"></div><div class="sk" style="height: 20px; width: 50%"></div><div class="sk" style="height: 12px; width: 80%"></div></div>
      <div class="card" style="display: flex; flex-direction: column; gap: 12px; padding: 16px"><div class="sk" style="width: 40px; height: 40px; border-radius: var(--radius-md)"></div><div class="sk" style="height: 20px; width: 50%"></div><div class="sk" style="height: 12px; width: 80%"></div></div>
      <div class="card" style="display: flex; flex-direction: column; gap: 12px; padding: 16px"><div class="sk" style="width: 40px; height: 40px; border-radius: var(--radius-md)"></div><div class="sk" style="height: 20px; width: 50%"></div><div class="sk" style="height: 12px; width: 80%"></div></div>
      <div class="card" style="display: flex; flex-direction: column; gap: 12px; padding: 16px"><div class="sk" style="width: 40px; height: 40px; border-radius: var(--radius-md)"></div><div class="sk" style="height: 20px; width: 50%"></div><div class="sk" style="height: 12px; width: 80%"></div></div>
    </div>
    <div class="card" aria-hidden="true" style="display: flex; flex-direction: column; gap: 16px; padding: 20px">
      <div class="sk" style="height: 20px; width: 180px"></div>
      <div class="sk" style="height: 44px; border-radius: var(--radius-md)"></div>
      <div class="sk" style="height: 44px; border-radius: var(--radius-md)"></div>
      <div class="sk" style="height: 44px; border-radius: var(--radius-md)"></div>
    </div>
  </main>

  <sc-if value="{{ isEditor }}" hint-placeholder-val="{{ true }}">
    <button type="button" class="fab">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M5 12h14M12 5v14"></path></svg>
      Nuevo registro
    </button>
  </sc-if>

  <nav class="bar" aria-label="Principal">
    <button type="button" class="bt" aria-current="{{ cur.dashboard }}" onClick="{{ go.dashboard }}">
      <span class="pic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg></span>
      Dashboard
    </button>
    <button type="button" class="bt" aria-current="{{ cur.registros }}" onClick="{{ go.registros }}">
      <span class="pic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8"></path></svg></span>
      Registros
      <sc-if value="{{ isEditor }}" hint-placeholder-val="{{ true }}">
        <span class="cnt" aria-label="4 registros por revisar">4</span>
      </sc-if>
    </button>
    <button type="button" class="bt" aria-current="{{ cur.empresas }}" onClick="{{ go.empresas }}">
      <span class="pic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4"></path></svg></span>
      Empresas
    </button>
    <button type="button" class="bt" aria-current="{{ cur.reportes }}" onClick="{{ go.reportes }}">
      <span class="pic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16M18 17V9M13 17V5M8 17v-3"></path></svg></span>
      Reportes
    </button>
  </nav>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <button type="button" class="scrim" aria-label="Cerrar menú de cuenta" onClick="{{ closeSheet }}"></button>
    <div class="sheet" role="dialog" aria-label="Cuenta">
      <span class="grab" aria-hidden="true"></span>
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 12px">
        <span class="avatar" aria-hidden="true" style="width: 44px; height: 44px; font-size: 15px">{{ initials }}</span>
        <span><span style="display: block; font-weight: 600">{{ userName }}</span><span style="display: block; font: 500 12px/16px var(--font-sans); color: var(--ink-muted)">{{ roleLabel }}</span></span>
      </div>
      <button type="button" class="out">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
        Cerrar sesión
      </button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rol":{"editor":"enum","options":["editor","viewer"],"default":"editor","section":"Vista"},"nombre":{"editor":"text","default":"María López","section":"Usuario"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 'dashboard', sheet: false };
  }
  renderVals() {
    const active = this.state.active;
    const titles = { dashboard: 'Dashboard', registros: 'Registros', empresas: 'Empresas', reportes: 'Reportes' };
    const ids = ['dashboard', 'registros', 'empresas', 'reportes'];
    const cur = {};
    const go = {};
    ids.forEach((id) => {
      cur[id] = id === active ? 'page' : 'false';
      go[id] = () => this.setState({ active: id });
    });
    const isEditor = (this.props.rol ?? 'editor') === 'editor';
    const name = this.props.nombre ?? 'María López';
    const initials = name.split(' ').filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
    return {
      cur: cur,
      go: go,
      pageTitle: titles[active],
      isEditor: isEditor,
      roleLabel: isEditor ? 'Editor' : 'Viewer',
      userName: name,
      initials: initials,
      sheetOpen: this.state.sheet,
      sheetExpanded: this.state.sheet ? 'true' : 'false',
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false })
    };
  }
}
</script>
</body>
</html>
