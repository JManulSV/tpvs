services:
  tpvs-postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tpvs}
      POSTGRES_USER: ${DB_USERNAME:-tpvs}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tpvs}
    volumes:
      - tpvs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tpvs} -d ${DB_DATABASE:-tpvs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tpvs-backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_KEY: ${APP_KEY:-base64:MAkRbTPzng0K+CAN8QI7qVGfJfAQMemd9pl8s3oxUJ0=}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_EXPIRE_ON_CLOSE: ${SESSION_EXPIRE_ON_CLOSE:-true}
      SESSION_COOKIE: ${SESSION_COOKIE:-tpvs_session}
      SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:3000,127.0.0.1:3000,::1:3000}
      DB_CONNECTION: pgsql
      DB_HOST: tpvs-postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-tpvs}
      DB_USERNAME: ${DB_USERNAME:-tpvs}
      DB_PASSWORD: ${DB_PASSWORD:-tpvs}
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: "true"
    volumes:
      - ./backend:/var/www/html
      - tpvs-backend-vendor:/var/www/html/vendor
      - tpvs-backend-storage:/var/www/html/storage
    ports:
      - "8000:8000"
    depends_on:
      tpvs-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  tpvs-queue-worker:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_KEY: ${APP_KEY:-base64:MAkRbTPzng0K+CAN8QI7qVGfJfAQMemd9pl8s3oxUJ0=}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_EXPIRE_ON_CLOSE: ${SESSION_EXPIRE_ON_CLOSE:-true}
      SESSION_COOKIE: ${SESSION_COOKIE:-tpvs_session}
      SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:3000,127.0.0.1:3000,::1:3000}
      DB_CONNECTION: pgsql
      DB_HOST: tpvs-postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-tpvs}
      DB_USERNAME: ${DB_USERNAME:-tpvs}
      DB_PASSWORD: ${DB_PASSWORD:-tpvs}
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/var/www/html
      - tpvs-backend-vendor:/var/www/html/vendor
      - tpvs-backend-storage:/var/www/html/storage
    command: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=1", "--timeout=90"]
    depends_on:
      tpvs-backend:
        condition: service_healthy

  tpvs-frontend:
    build:
      context: ./frontend
    environment:
      LARAVEL_API_URL: http://tpvs-backend:8000
    volumes:
      - ./frontend:/app
      - tpvs-frontend-node-modules:/app/node_modules
      - tpvs-frontend-next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      tpvs-backend:
        condition: service_healthy

volumes:
  tpvs-postgres-data:
  tpvs-backend-vendor:
  tpvs-backend-storage:
  tpvs-frontend-node-modules:
  tpvs-frontend-next:
