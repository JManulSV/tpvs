<html lang="es">
<head>
<meta charset="utf-8">
<title>Registros Editor móvil</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--brand-navy:#324168;--brand-sky:#64B3DD;--canvas:#EEF3F8;--surface:#FFFFFF;--surface-muted:#F5F8FC;--border:#DBE4EE;--border-strong:#6F819C;--ink:#17203A;--ink-muted:#4F5B77;--primary:#324168;--primary-hover:#28345A;--on-primary:#FFFFFF;--accent-soft:#E3F1FA;--accent-soft-ink:#1B5C85;--ring:#324168;--hero:#324168;--on-hero:#FFFFFF;--hero-ink-muted:#C7D0E4;--hero-hover:rgba(255,255,255,.10);--status-confirmed:#0F6B3A;--status-confirmed-bg:#E3F5EA;--status-needs-review:#8A4B00;--status-needs-review-bg:#FDF0D8;--status-error:#A3202A;--status-error-bg:#FCE6E7;--status-processing:#4D3FA3;--status-processing-bg:#ECE9FB;--status-pending:#46526C;--status-pending-bg:#E8EDF4;--status-canceled:#5B6478;--status-canceled-bg:#EEF0F4;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;--shadow-card:0 1px 2px rgba(23,32,58,.05),0 4px 16px rgba(23,32,58,.04);--shadow-popover:0 8px 32px rgba(23,32,58,.14);--font-sans:"Plus Jakarta Sans",system-ui,sans-serif}
.root{box-sizing:border-box;position:relative;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:20px}
.root *,.root *::before,.root *::after{box-sizing:border-box}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{flex:none;display:flex;align-items:center;gap:4px;padding:8px 12px 8px 20px;background:var(--hero);color:var(--on-hero)}
.brand{margin-right:auto;font:700 22px/28px var(--font-sans);letter-spacing:-.01em}
.tbtn{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:var(--radius-pill);background:transparent;color:var(--on-hero);cursor:pointer}
.tbtn:hover{background:var(--hero-hover)}
.tbtn:focus-visible{outline:2px solid var(--brand-sky);outline-offset:2px}
.tbtn .ic{width:20px;height:20px}
.avatar{display:grid;place-items:center;flex:none;width:36px;height:36px;margin-left:4px;border-radius:var(--radius-pill);background:var(--brand-sky);color:var(--ink);font:700 13px/16px var(--font-sans)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 152px;display:flex;flex-direction:column;gap:16px}
.search{flex:none;display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-pill);color:var(--ink-muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:400 14px/20px var(--font-sans)}
.search input::placeholder{color:var(--ink-muted)}
.search:focus-within{outline:2px solid var(--ring);outline-offset:2px}
.chips{flex:none;display:flex;gap:8px;margin:0 -16px;padding:0 16px 4px;overflow-x:auto}
.cw{position:relative;flex:none}
.chip{appearance:none;-webkit-appearance:none;height:44px;padding:0 36px 0 16px;border:1px solid var(--border-strong);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink);font:600 13px/20px var(--font-sans);cursor:pointer}
.chip.on{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:var(--accent-soft-ink)}
.chip:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.cw .ic{position:absolute;right:14px;top:14px;pointer-events:none;color:var(--ink-muted)}
.cw .chip.on+.ic{color:var(--accent-soft-ink)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rec{position:relative;display:flex;flex-direction:column;gap:4px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
.rec:hover{background:var(--surface-muted)}
.rt{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rl{color:var(--ink);text-decoration:none;font:600 15px/24px var(--font-sans)}
.rl::after{content:"";position:absolute;inset:0;border-radius:var(--radius-lg)}
.rl:focus-visible{outline:none}
.rl:focus-visible::after{outline:2px solid var(--ring);outline-offset:2px}
.cname.none{color:var(--ink-muted);font-style:italic;font-weight:500}
.mt{font:500 12px/16px var(--font-sans);color:var(--ink-muted)}
.rb{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.amt{font:700 18px/24px var(--font-sans);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.amt.dim{color:var(--ink-muted);font-weight:500}
.act{display:inline-flex;align-items:center;gap:2px;color:var(--accent-soft-ink);font:600 13px/16px var(--font-sans)}
.chev{color:var(--ink-muted)}
.s-review{background:var(--status-needs-review-bg);color:var(--status-needs-review)}
.s-pending{background:var(--status-pending-bg);color:var(--status-pending)}
.s-processing{background:var(--status-processing-bg);color:var(--status-processing)}
.s-error{background:var(--status-error-bg);color:var(--status-error)}
.s-confirmed{background:var(--status-confirmed-bg);color:var(--status-confirmed)}
.s-canceled{background:var(--status-canceled-bg);color:var(--status-canceled)}
.pill{display:inline-flex;align-items:center;flex:none;height:24px;padding:0 10px;border-radius:var(--radius-pill);font:600 12px/16px var(--font-sans);white-space:nowrap}
.clear{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--accent-soft-ink);font:600 13px/16px var(--font-sans);cursor:pointer;border-radius:var(--radius-sm)}
.clear:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border:1px solid transparent;border-radius:var(--radius-pill);background:var(--accent-soft);color:var(--accent-soft-ink);font:600 14px/20px var(--font-sans);cursor:pointer}
.btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 16px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
.fab{position:absolute;right:16px;bottom:84px;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px;border:0;border-radius:var(--radius-pill);background:var(--primary);color:var(--on-primary);font:600 14px/20px var(--font-sans);box-shadow:var(--shadow-popover);cursor:pointer}
.fab:hover{background:var(--primary-hover)}
.fab:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.bar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;background:var(--surface);border-top:1px solid var(--border)}
.bt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;border:0;border-radius:var(--radius-md);background:transparent;color:var(--ink-muted);font:600 11px/16px var(--font-sans);cursor:pointer}
.bt:focus-visible{outline:2px solid var(--ring);outline-offset:-2px}
.bt .pic{display:grid;place-items:center;width:56px;height:28px;border-radius:var(--radius-pill);transition:background-color .15s ease}
.bt .ic{width:20px;height:20px}
.bt[aria-current="page"]{color:var(--ink)}
.bt[aria-current="page"] .pic{background:var(--accent-soft);color:var(--accent-soft-ink)}
.bt .cnt{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;border-radius:var(--radius-pill);background:var(--status-needs-review-bg);color:var(--status-needs-review);font:700 11px/14px var(--font-sans)}
</style>
</helmet>
<div class="root">
  <header class="top">
    <span class="brand">Tpvs</span>
    <button type="button" class="tbtn" aria-label="Notificaciones">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
    </button>
    <span class="avatar" role="img" aria-label="{{ userName }}, Editor">{{ initials }}</span>
  </header>

  <main class="scroll">
    <h1 style="margin: 0; font: 700 24px/32px var(--font-sans); letter-spacing: -0.01em">Registros</h1>

    <label class="search">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input type="search" placeholder="Empresa, afiliación o sucursal…" aria-label="Buscar registros" value="{{ f.q }}" onChange="{{ on.q }}">
    </label>

    <div class="chips" role="group" aria-label="Filtros">
      <span class="cw"><select class="chip {{ on2.empresa }}" aria-label="Empresa" style="width: 196px" value="{{ f.empresa }}" onChange="{{ on.empresa }}"><option value="all">Todas las empresas</option><option value="Company ABC">Company ABC</option><option value="Company XYZ">Company XYZ</option><option value="Company North">Company North</option></select><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
      <span class="cw"><select class="chip {{ on2.status }}" aria-label="Estado" style="width: 176px" value="{{ f.status }}" onChange="{{ on.status }}"><option value="all">Todos los estados</option><option value="PENDING">Pendiente</option><option value="PROCESSING">Procesando</option><option value="NEEDS_REVIEW">Por revisar</option><option value="ERROR">Error</option><option value="CONFIRMED">Confirmado</option><option value="CANCELED">Cancelado</option></select><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
      <span class="cw"><select class="chip {{ on2.year }}" aria-label="Año" style="width: 148px" value="{{ f.year }}" onChange="{{ on.year }}"><option value="all">Todos los años</option><option value="2026">Año 2026</option><option value="2025">Año 2025</option></select><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
      <span class="cw"><select class="chip {{ on2.month }}" aria-label="Mes" style="width: 176px" value="{{ f.month }}" onChange="{{ on.month }}"><option value="all">Todos los meses</option><option value="01">Mes: enero</option><option value="02">Mes: febrero</option><option value="03">Mes: marzo</option><option value="04">Mes: abril</option><option value="05">Mes: mayo</option><option value="06">Mes: junio</option><option value="07">Mes: julio</option><option value="08">Mes: agosto</option><option value="09">Mes: septiembre</option><option value="10">Mes: octubre</option><option value="11">Mes: noviembre</option><option value="12">Mes: diciembre</option></select><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
      <span class="cw"><select class="chip {{ on2.week }}" aria-label="Semana" style="width: 160px" value="{{ f.week }}" onChange="{{ on.week }}"><option value="all">Todas las semanas</option><option value="1">Semana 1</option><option value="2">Semana 2</option><option value="3">Semana 3</option><option value="4">Semana 4</option><option value="5">Semana 5</option><option value="6">Semana 6</option><option value="7">Semana 7</option><option value="8">Semana 8</option><option value="9">Semana 9</option><option value="10">Semana 10</option><option value="11">Semana 11</option><option value="12">Semana 12</option><option value="13">Semana 13</option><option value="14">Semana 14</option><option value="15">Semana 15</option><option value="16">Semana 16</option><option value="17">Semana 17</option><option value="18">Semana 18</option><option value="19">Semana 19</option><option value="20">Semana 20</option><option value="21">Semana 21</option><option value="22">Semana 22</option><option value="23">Semana 23</option><option value="24">Semana 24</option><option value="25">Semana 25</option><option value="26">Semana 26</option><option value="27">Semana 27</option><option value="28">Semana 28</option><option value="29">Semana 29</option><option value="30">Semana 30</option><option value="31">Semana 31</option><option value="32">Semana 32</option><option value="33">Semana 33</option><option value="34">Semana 34</option><option value="35">Semana 35</option><option value="36">Semana 36</option><option value="37">Semana 37</option><option value="38">Semana 38</option><option value="39">Semana 39</option><option value="40">Semana 40</option><option value="41">Semana 41</option><option value="42">Semana 42</option><option value="43">Semana 43</option><option value="44">Semana 44</option><option value="45">Semana 45</option><option value="46">Semana 46</option><option value="47">Semana 47</option><option value="48">Semana 48</option><option value="49">Semana 49</option><option value="50">Semana 50</option><option value="51">Semana 51</option><option value="52">Semana 52</option><option value="53">Semana 53</option></select><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
      <span class="cw"><select class="chip {{ on2.source }}" aria-label="Fuente" style="width: 160px" value="{{ f.source }}" onChange="{{ on.source }}"><option value="all">Todas las fuentes</option><option value="IMAGE">Fuente: Imagen</option><option value="MANUAL">Fuente: Manual</option></select><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -4px 0">
      <span class="mt" style="font-size: 13px"><strong style="color: var(--ink); font-variant-numeric: tabular-nums">{{ count }}</strong> {{ countWord }} · Retorno confirmado <strong style="color: var(--ink); font-variant-numeric: tabular-nums">{{ confirmedTotal }}</strong></span>
      <sc-if value="{{ hasFilters }}" hint-placeholder-val="{{ false }}">
        <button type="button" class="clear" onClick="{{ clear }}">Limpiar</button>
      </sc-if>
    </div>

    <ul class="list" aria-label="Lista de registros">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
        <li class="rec">
          <div class="rt">
            <a class="rl" href="{{ r.href }}" aria-label="{{ r.aria }}"><span class="cname {{ r.nameClass }}">{{ r.companyLabel }}</span></a>
            <span class="pill {{ r.statusClass }}">{{ r.statusLabel }}</span>
          </div>
          <span class="mt">{{ r.meta }}</span>
          <span class="mt">{{ r.sub }}</span>
          <div class="rb">
            <span class="amt {{ r.amountClass }}">{{ r.amountLabel }}</span>
            <sc-if value="{{ r.hasAction }}" hint-placeholder-val="{{ false }}">
              <span class="act">{{ r.action }}<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span>
            </sc-if>
            <sc-if value="{{ r.noAction }}" hint-placeholder-val="{{ true }}">
              <span class="chev"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="m9 18 6-6-6-6"></path></svg></span>
            </sc-if>
          </div>
        </li>
      </sc-for>
    </ul>

    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div class="empty">
        <h2 style="margin: 0; font: 600 16px/24px var(--font-sans)">No hay registros con estos filtros</h2>
        <p style="margin: 0; color: var(--ink-muted)">Prueba con otra semana o quita algún filtro.</p>
        <button type="button" class="btn" style="margin-top: 8px" onClick="{{ clear }}">Limpiar filtros</button>
      </div>
    </sc-if>
  </main>

  <sc-if value="{{ isEditor }}" hint-placeholder-val="{{ true }}">
    <button type="button" class="fab">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M5 12h14M12 5v14"></path></svg>
      Nuevo registro
    </button>
  </sc-if>

  <nav class="bar" aria-label="Principal">
    <button type="button" class="bt" aria-current="{{ cur.dashboard }}" onClick="{{ go.dashboard }}">
      <span class="pic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg></span>
      Dashboard
    </button>
    <button type="button" class="bt" aria-current="{{ cur.registros }}" onClick="{{ go.registros }}">
      <span class="pic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8"></path></svg></span>
      Registros
      <sc-if value="{{ isEditor }}" hint-placeholder-val="{{ true }}">
        <span class="cnt" aria-label="4 registros por revisar">4</span>
      </sc-if>
    </button>
    <button type="button" class="bt" aria-current="{{ cur.empresas }}" onClick="{{ go.empresas }}">
      <span class="pic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4"></path></svg></span>
      Empresas
    </button>
    <button type="button" class="bt" aria-current="{{ cur.reportes }}" onClick="{{ go.reportes }}">
      <span class="pic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16M18 17V9M13 17V5M8 17v-3"></path></svg></span>
      Reportes
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"nombre":{"editor":"text","default":"María López","section":"Usuario"},"$preview":{"width":390,"height":844}}'>
const ROLE = 'editor';

const STATUS = {

// id, empresa, año, semana, fin de semana, fuente, estado, retorno, afiliación, sucursal, movimientos adicionales
const DATA = [

  ['r02', null, null, null, null, 'IMAGE', 'PENDING', null, null, null, 0],
  ['r03', null, null, null, null, 'IMAGE', 'PENDING', null, null, null, 0],
  ['r04', null, null, null, null, 'IMAGE', 'PROCESSING', null, null, null, 0],
  ['r05', 'Company ABC', 2026, 37, '2026-09-08', 'IMAGE', 'PROCESSING', null, null, null, 0],
  ['r06', null, null, null, null, 'IMAGE', 'ERROR', null, null, null, 0],
  ['r07', 'Company XYZ', 2026, 38, '2026-09-15', 'IMAGE', 'NEEDS_REVIEW', 9800, '123456', 'Guadalajara', 1],
  ['r08', 'Company ABC', 2026, 38, '2026-09-15', 'IMAGE', 'NEEDS_REVIEW', 5100, '204518', 'Zapopan', 2],
  ['r09', 'Company North', 2026, 37, '2026-09-08', 'IMAGE', 'NEEDS_REVIEW', 2640, '771902', 'Guadalajara', 0],
  ['r10', 'Company XYZ', 2026, 37, '2026-09-08', 'IMAGE', 'NEEDS_REVIEW', 4880, '338105', 'Tonalá', 0],
  ['r11', 'Company ABC', 2026, 38, '2026-09-15', 'IMAGE', 'CONFIRMED', 7200, '204518', 'Zapopan', 0],
  ['r12', 'Company North', 2026, 38, '2026-09-15', 'MANUAL', 'CONFIRMED', 3450, '771902', 'Tlaquepaque', 0],
  ['r13', 'Company ABC', 2026, 37, '2026-09-08', 'MANUAL', 'CONFIRMED', 5500, '204518', 'Zapopan', 0],
  ['r14', 'Company XYZ', 2026, 36, '2026-09-01', 'IMAGE', 'CONFIRMED', 6310, '338105', 'Tonalá', 0],
  ['r15', 'Company ABC', 2026, 35, '2026-08-25', 'IMAGE', 'CONFIRMED', 9120, '204518', 'Zapopan', 3],
  ['r16', 'Company North', 2026, 37, '2026-09-08', 'IMAGE', 'CANCELED', 2100, '771902', 'Guadalajara', 0]
];
const money = (n) => '$' + n.toLocaleString('en-US');
const fmtDate = (iso) => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(2, 4) : '';
const WAITING = {
  PENDING: 'En cola para procesar',
  PROCESSING: 'Extrayendo datos de la imagen',
  ERROR: 'No se pudo leer la imagen'
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: 'registros', q: '', empresa: 'all', year: 'all', month: 'all', week: 'all', status: 'all', source: 'all' };
  }
  renderVals() {
    const s = this.state;
    const isEditor = ROLE === 'editor';
    const q = s.q.trim().toLowerCase();
    const list = DATA.filter((d) => {
      const hay = ((d[1] || '') + ' ' + (d[8] || '') + ' ' + (d[9] || '')).toLowerCase();
      if (q && hay.indexOf(q) === -1) return false;
      if (s.empresa !== 'all' && d[1] !== s.empresa) return false;
      if (s.year !== 'all' && String(d[2]) !== s.year) return false;
      if (s.month !== 'all' && !(d[4] && d[4].slice(5, 7) === s.month)) return false;
      if (s.week !== 'all' && String(d[3]) !== s.week) return false;
      if (s.status !== 'all' && d[6] !== s.status) return false;
      if (s.source !== 'all' && d[5] !== s.source) return false;
      return true;
    });
    let confirmed = 0;
    const rows = list.map((d) => {
      const st = STATUS[d[6]];
      const hasCompany = !!d[1];
      const company = hasCompany ? d[1] : 'Sin empresa asignada';
      const src = d[5] === 'IMAGE' ? 'Imagen' : 'Manual';
      const meta = d[3] ? src + ' · Semana ' + d[3] + ' · fin ' + fmtDate(d[4]) : src + ' · Sin periodo todavía';
      let sub = WAITING[d[6]] || '';
      if (d[8]) sub = 'Afil. ' + d[8] + ' · ' + d[9] + (d[10] ? ' · +' + d[10] + (d[10] === 1 ? ' movimiento' : ' movimientos') : '');
      if (d[6] === 'CONFIRMED') confirmed += d[7];
      let action = '';
      if (isEditor && d[6] === 'NEEDS_REVIEW') action = 'Revisar';
      if (isEditor && d[6] === 'ERROR') action = 'Ver error';
      return {
        href: '#registro-' + d[0],
        aria: 'Abrir registro de ' + company + (d[3] ? ', semana ' + d[3] : '') + ', ' + st[0],
        companyLabel: company,
        nameClass: hasCompany ? '' : 'none',
        meta: meta,
        sub: sub,
        amountLabel: d[7] === null ? '—' : money(d[7]),
        amountClass: (d[7] === null || d[6] === 'CANCELED') ? 'dim' : '',
        statusLabel: st[0],
        statusClass: st[1],
        hasAction: action !== '',
        noAction: action === '',
        action: action
      };
    });
    const ids = ['dashboard', 'registros', 'empresas', 'reportes'];
    const cur = {};
    const go = {};
    ids.forEach((id) => {
      cur[id] = id === s.active ? 'page' : 'false';
      go[id] = () => this.setState({ active: id });
    });
    const set = (k) => (e) => this.setState({ [k]: e.target.value });
    const on = { q: set('q'), empresa: set('empresa'), year: set('year'), month: set('month'), week: set('week'), status: set('status'), source: set('source') };
    const on2 = {};
    Object.keys(INITIAL).forEach((k) => { on2[k] = s[k] !== INITIAL[k] ? 'on' : ''; });
    const hasFilters = Object.keys(INITIAL).some((k) => s[k] !== INITIAL[k]);
    const name = this.props.nombre ?? 'María López';
    const initials = name.split(' ').filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
    return {
      cur: cur,
      go: go,
      on: on,
      on2: on2,
      f: { q: s.q, empresa: s.empresa, year: s.year, month: s.month, week: s.week, status: s.status, source: s.source },
      rows: rows,
      isEmpty: rows.length === 0,
      hasFilters: hasFilters,
      clear: () => this.setState(Object.assign({}, INITIAL)),
      count: rows.length,
      countWord: rows.length === 1 ? 'registro' : 'registros',
      confirmedTotal: money(confirmed),
      isEditor: isEditor,
      userName: name,
      initials: initials
    };
  }
}
</script>
</body>
</html>
