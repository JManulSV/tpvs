# Development overrides. `docker compose` loads this file automatically on top of compose.yaml.
# Source code is bind-mounted from the host, and ports are published for local tools.

# Development image of the backend, built as the host user (UID/GID from the root .env).
x-backend-dev-build: &backend-dev-build
  context: ./backend
  target: dev
  args:
    UID: ${UID:-1000}
    GID: ${GID:-1000}

services:
  tpvs-migrate:
    build: *backend-dev-build
    # Starts as root only to fix volume ownership; the entrypoint then drops to www-data.
    user: root
    volumes:
      - ./backend:/var/www/html
      - tpvs-backend-vendor:/var/www/html/vendor

  tpvs-postgres:
    ports:
      - "127.0.0.1:5432:5432"

  tpvs-backend:
    build: *backend-dev-build
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ./backend:/var/www/html
      - tpvs-backend-vendor:/var/www/html/vendor
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  tpvs-queue-worker:
    build: *backend-dev-build
    volumes:
      - ./backend:/var/www/html
      - tpvs-backend-vendor:/var/www/html/vendor
    # queue:listen boots a fresh PHP process per job, so code changes apply to the next job.
    # The wrapper adds graceful SIGTERM handling (see backend/docker/queue-listen.sh).
    command: ["sh", "docker/queue-listen.sh", "database", "--sleep=3", "--timeout=330"]

  tpvs-frontend:
    build:
      context: ./frontend
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      LARAVEL_API_URL: http://tpvs-backend:8000
    volumes:
      - ./frontend:/app
      - tpvs-frontend-node-modules:/app/node_modules
      - tpvs-frontend-next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      tpvs-backend:
        condition: service_healthy

  tpvs-ollama:
    # Host port for local tools such as tools/ai-spike/run_ollama_spike.py. Localhost only.
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    mem_limit: 8g
